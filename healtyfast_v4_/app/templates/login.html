{% extends 'layout.html' %}
{% block content %}

<section class="container py-5 my-5 scroll-reveal">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card card-custom p-4 shadow-lg border-0 rounded-4">

                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark m-0">
                        Control de Acceso
                    </h2>

                    <p class="text-muted small">
                        Selecciona el perfil de simulación académica
                    </p>
                </div>

                <form action="{{ url_for('main.login') }}" method="POST">

                    <!-- Rol -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">
                            Perfil de Entrada
                        </label>

                        <select class="form-select rounded-3" name="rol" required>
                            <option value="cliente">
                                Perfil Cliente (Samuel Vega)
                            </option>

                            <option value="administrador">
                                Perfil Administrador (Docente Evaluador)
                            </option>
                        </select>
                    </div>

                    <!-- Correo -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">
                            Credencial Electrónica
                        </label>

                        <input
                            type="email"
                            class="form-control rounded-3"
                            name="correo"
                            placeholder="correo@healthyfast.com"
                            required
                        >
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            class="form-control rounded-3"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                    </div>

                    <!-- Botón -->
                    <button
                        class="btn btn-vinotinto w-100 py-2 rounded-pill fw-bold shadow-sm"
                        type="submit"
                    >
                        <i class="fa-solid fa-lock me-2"></i>
                        Autenticar Sistema
                    </button>

                </form>

            </div>

        </div>
    </div>
</section>

{% endblock %}
```
